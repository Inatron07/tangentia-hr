<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Copilot · Tangentia</title>
<link rel="icon" href="/assets/tangentia-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F172A; --muted: #475569; --subtle: #64748B; --line: #E2E8F0; --line-strong: #CBD5E1;
    --soft: #F1F5F9; --bg: #FFFFFF; --accent: #0F766E; --accent-ink: #FFFFFF; --warn-bg: #FEF3C7; --warn-ink: #92400E;
    --avatar-bg: #E0F2FE; --avatar-ink: #075985;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  button, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-bottom: 1px solid transparent; }
  body.chatting header { border-bottom-color: var(--soft); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-logo { height: 26px; width: auto; display: block; flex-shrink: 0; }
  .brand .sep { color: var(--line-strong); font-size: 20px; }
  .brand .mod { font: 700 16px Manrope, sans-serif; white-space: nowrap; }
  .new-chat { display: none; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  body.chatting .new-chat { display: inline-flex; }
  .new-chat:hover { background: var(--soft); }

  /* empty state */
  #empty { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 24px 24px 12vh; }
  #empty .inner { width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  #empty h1 { margin: 0; text-align: center; font: 800 clamp(28px, 4vw, 38px)/1.15 Manrope, sans-serif; letter-spacing: -0.02em; }
  #empty p { margin: 8px 0 0; text-align: center; color: var(--muted); font-size: 16px; }
  body.chatting #empty { display: none; }

  /* composer */
  .composer { width: 100%; display: flex; align-items: flex-end; gap: 10px; border: 1px solid var(--line-strong); border-radius: 18px; padding: 10px 10px 10px 16px; background: #fff; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { flex-grow: 1; border: 0; outline: none; resize: none; background: transparent; font-size: 16px; line-height: 1.5; padding: 10px 0; max-height: 200px; }
  #empty .composer { flex-direction: column; align-items: stretch; padding: 16px 16px 12px; border-radius: 20px; }
  #empty .composer textarea { font-size: 17px; min-height: 84px; padding: 0; }
  #empty .composer .row { display: flex; justify-content: flex-end; }
  .send { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--accent); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .send:disabled { opacity: 0.45; cursor: default; }

  /* conversation */
  #chat { display: none; flex-grow: 1; flex-direction: column; }
  body.chatting #chat { display: flex; }
  #log { flex-grow: 1; display: flex; justify-content: center; padding: 32px 24px 24px; }
  #log .col { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 22px; }
  .dock { position: sticky; bottom: 0; display: flex; justify-content: center; padding: 12px 24px 20px; background: linear-gradient(rgba(255,255,255,0), #fff 24%); }
  .dock .composer { max-width: 760px; }
  .hint { max-width: 760px; width: 100%; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--subtle); }

  .msg-user { align-self: flex-end; max-width: 80%; background: var(--soft); padding: 12px 16px; border-radius: 18px 18px 4px 18px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg-ai { display: flex; gap: 12px; align-items: flex-start; }
  .msg-ai .av { width: 32px; height: 32px; flex-shrink: 0; object-fit: contain; margin-top: 2px; }
  .msg-ai .body { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.6; }
  .msg-ai .body p { margin: 0; overflow-wrap: anywhere; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .status code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; background: var(--soft); border-radius: 6px; padding: 2px 6px; overflow-wrap: anywhere; }
  .error { color: #9F1239; }

  .card { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; }
  .card .ini { width: 40px; height: 40px; border-radius: 50%; background: var(--avatar-bg); color: var(--avatar-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .card .info { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .card .name { font-weight: 700; font-size: 15px; }
  .card .meta { font-size: 13px; color: var(--muted); }
  .card .why { font-size: 14px; color: #334155; }
  .card .stale { display: inline-block; font-size: 12px; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); border-radius: 999px; padding: 1px 8px; margin-left: 4px; }
  .card .open { min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .card .open:hover { background: var(--soft); }
  .card .actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .ai-read { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 5px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: #6B21A8; white-space: nowrap;
    background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, #38BDF8, #A21CAF, #F97316) border-box; border: 1.5px solid transparent; cursor: default; }
  .ai-read img { width: 16px; height: 16px; object-fit: contain; }
  .fit-wrap { position: relative; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .fit { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; min-height: 26px; border-radius: 999px; border: 0; background: #DCFCE7; color: #166534; font: inherit; font-size: 12px; font-weight: 700; cursor: help; }
  .fit:focus-visible { outline: 2px solid #16A34A; outline-offset: 2px; }
  .fit-hint { font-size: 10.5px; color: var(--subtle); }
  .fit-tip { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 260px; padding: 10px 12px; border-radius: 10px; background: var(--ink); color: #fff;
    font-size: 12.5px; line-height: 1.45; font-weight: 400; text-align: left; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.25); visibility: hidden; opacity: 0; transition: opacity .12s; }
  .fit-wrap:hover .fit-tip, .fit:focus-visible + .fit-tip, .fit-wrap.open .fit-tip { visibility: visible; opacity: 1; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .facts:empty { display: none; }
  .fact { font-size: 12.5px; line-height: 1.4; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: #334155; }
  .fact b { font-weight: 600; color: var(--ink); }
  .fact.muted { background: #fff; color: var(--subtle); border: 1px dashed var(--line-strong); }
  .fact.muted b { color: var(--subtle); }
  .fact.loading { width: 92px; height: 23px; background: linear-gradient(90deg, var(--soft), #F8FAFC, var(--soft)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
  .facts .skills { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
  .fact-note { font-size: 12px; color: var(--subtle); align-self: center; }
  .fact-btn { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--accent); background: none; border: 1px solid #99F6E4; border-radius: 999px; padding: 2px 10px; min-height: 26px; cursor: pointer; }
  .fact-btn:hover { background: #F0FDFA; }
  .more-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 2px; }
  .more-info { font-size: 13px; color: var(--muted); }
  .more { min-height: 44px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 12px; background: #fff; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .more:hover { background: var(--soft); }
  .skel { height: 72px; border-radius: 14px; background: linear-gradient(90deg, var(--soft), #F8FAFC, var(--soft)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
  @keyframes sh { to { background-position: -200% 0; } }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--subtle); animation: bl 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bl { 50% { opacity: .25; } }

  @media (max-width: 560px) {
    header { padding: 12px 16px; }
    .brand .sep, .brand .mod { display: none; }
    #log { padding: 20px 16px; } .dock { padding: 10px 16px 16px; }
    .card { flex-wrap: wrap; } .card .info { flex: 1 1 calc(100% - 54px); } .card .actions { margin-left: 54px; flex: 1 1 calc(100% - 54px); min-width: 0; flex-direction: row; align-items: flex-start; flex-wrap: wrap; }
    .fit-wrap { align-items: flex-start; } .fit-tip { left: 0; right: auto; width: min(260px, 70vw); }
    .msg-user { max-width: 90%; }
  }
  @media (prefers-reduced-motion: reduce) { .skel, .typing span, .fact.loading { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="brand-logo" src="/assets/tangentia-logo.png" alt="Tangentia">
    <span class="sep" aria-hidden="true">/</span><span class="mod">HR Copilot</span>
  </div>
  <button type="button" class="new-chat" id="newChat">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat
  </button>
</header>

<section id="empty" aria-labelledby="hello">
  <div class="inner">
    <div>
      <h1 id="hello">Who are you hiring today?</h1>
      <p>Describe the role. I'll search every resume in CATS and shortlist the best fits.</p>
    </div>
    <form class="composer" id="firstForm">
      <label for="firstInput" class="sr">Message HR Copilot</label>
      <textarea id="firstInput" rows="3" placeholder="e.g. Need 3 React developers in Goa or Pune, updated in the last year"></textarea>
      <div class="row">
        <button class="send" type="submit" aria-label="Send">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </form>
  </div>
</section>

<section id="chat" aria-label="Conversation">
  <div id="log"><div class="col" id="col" aria-live="polite"></div></div>
  <div class="dock">
    <div style="width:100%;max-width:760px">
      <form class="composer" id="form">
        <label for="input" class="sr">Message HR Copilot</label>
        <textarea id="input" rows="1" placeholder="Ask a follow-up"></textarea>
        <button class="send" id="sendBtn" type="submit" aria-label="Send">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </form>
      <p class="hint">Answers come from your CATS data. Check details before contacting candidates.</p>
    </div>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const col = $('col'), input = $('input'), firstInput = $('firstInput'), sendBtn = $('sendBtn');
  let chatId = null, busy = false;

  // ---------- sending ----------
  $('firstForm').addEventListener('submit', (e) => { e.preventDefault(); send(firstInput.value); });
  $('form').addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });
  for (const ta of [input, firstInput]) {
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ta.form.requestSubmit(); }
    });
    ta.addEventListener('input', () => { if (ta === input) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; } });
  }
  $('newChat').addEventListener('click', () => {
    if (busy) return;
    chatId = null; col.innerHTML = ''; document.body.classList.remove('chatting'); firstInput.value = ''; firstInput.focus();
  });
  firstInput.focus();

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true;
    document.body.classList.add('chatting');
    input.value = ''; input.style.height = 'auto'; firstInput.value = '';

    col.querySelectorAll('.more-row').forEach((r) => r.remove());
    const u = document.createElement('div'); u.className = 'msg-user'; u.textContent = text; col.appendChild(u);
    const ai = aiBubble(); col.appendChild(ai.el);
    scrollDown();

    let raw = '';
    try {
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, chatId }) });
      if (res.status === 401) { location.href = '/login'; return; }
      if (!res.ok || !res.body) throw new Error((await res.json().catch(() => ({}))).error || `Request failed (${res.status})`);
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) !== -1) {
          const block = buf.slice(0, i); buf = buf.slice(i + 2);
          const ev = (block.match(/^event: (.*)$/m) || [])[1];
          const data = JSON.parse((block.match(/^data: (.*)$/m) || [, '{}'])[1]);
          if (ev === 'chat') chatId = data.chatId;
          else if (ev === 'chunk') { raw += data.text; ai.render(raw, true); scrollDown(true); }
          else if (ev === 'error') throw new Error(data.message);
        }
      }
      ai.render(raw, false);
      if (!raw.trim()) ai.error('No answer came back. Please try again.');
      enrichCards(ai.el);
    } catch (err) {
      ai.render(raw, false);
      ai.error(err.message || 'Something went wrong.');
    } finally {
      busy = false; sendBtn.disabled = false; input.focus(); scrollDown(true);
    }
  }

  function scrollDown(soft) {
    const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 220;
    if (!soft || nearBottom) window.scrollTo({ top: document.body.scrollHeight, behavior: soft ? 'auto' : 'smooth' });
  }

  // ---------- assistant message rendering ----------
  function aiBubble() {
    const el = document.createElement('div'); el.className = 'msg-ai';
    el.innerHTML = '<img class="av" src="/assets/tangentia-mark.png" alt="" aria-hidden="true"><div class="body"><div class="typing" aria-label="Thinking"><span></span><span></span><span></span></div></div>';
    const body = el.querySelector('.body');
    let errEl = null;
    return {
      el,
      render(raw, streaming) {
        const parts = parseReply(raw, streaming);
        body.replaceChildren(...parts);
        if (errEl) body.appendChild(errEl);
      },
      error(msg) { errEl = document.createElement('p'); errEl.className = 'error'; errEl.textContent = msg; body.appendChild(errEl); },
    };
  }

  // The agent writes: preamble [[SEARCH]]{json}[[/SEARCH]] intro [[CANDIDATES]][json][[/CANDIDATES]] outro
  function parseReply(raw, streaming) {
    const out = [];
    let lastTotal = null;
    const sIdx = raw.indexOf('[[SEARCH]]');
    const cIdx = raw.indexOf('[[CANDIDATES]]');
    const hasMarkers = sIdx !== -1 || cIdx !== -1;

    if (!hasMarkers) {
      const text = streaming ? hideHalfMarker(raw) : raw;
      if (text.trim()) out.push(...paragraphs(text));
      else if (streaming) out.push(typing());
      return out;
    }

    let rest = raw.slice(sIdx !== -1 ? sIdx : cIdx);
    // search block
    if (rest.startsWith('[[SEARCH]]')) {
      const end = rest.indexOf('[[/SEARCH]]');
      if (end === -1) { out.push(statusLine('Searching CATS…')); out.push(skeleton()); return out; }
      const s = parseSearch(rest.slice(10, end));
      lastTotal = s.total;
      out.push(statusLine(s.total != null ? `Searched CATS · ${s.total.toLocaleString()} matches` : 'Searched CATS', s.query));
      rest = rest.slice(end + 11);
    }
    // intro + candidates
    const c = rest.indexOf('[[CANDIDATES]]');
    if (c === -1) {
      const text = streaming ? hideHalfMarker(rest) : rest;
      if (text.trim()) out.push(...paragraphs(text));
      if (streaming) out.push(skeleton());
      return out;
    }
    if (rest.slice(0, c).trim()) out.push(...paragraphs(rest.slice(0, c)));
    const cEnd = rest.indexOf('[[/CANDIDATES]]');
    if (cEnd === -1) { out.push(skeleton()); return out; }
    const list = parseCandidates(rest.slice(c + 14, cEnd));
    if (list.length) list.forEach((cand) => out.push(card(cand)));
    else out.push(...paragraphs('No candidates could be read from this answer.'));
    const outro = rest.slice(cEnd + 15);
    if (outro.trim()) out.push(...paragraphs(outro));
    if (!streaming && list.length && lastTotal && lastTotal > list.length) out.push(moreButton(list.length, lastTotal));
    return out;
  }

  function hideHalfMarker(t) { const i = t.lastIndexOf('[['); return i !== -1 && !t.slice(i).includes(']]') ? t.slice(0, i) : t; }

  function parseSearch(s) {
    const q = (s.match(/"query"\s*:\s*"([\s\S]*?)"\s*,\s*"total"/) || s.match(/"query"\s*:\s*"([\s\S]*?)"\s*\}/) || [])[1];
    const t = (s.match(/"total"\s*:\s*(\d+)/) || [])[1];
    return { query: q ? q.replace(/\\"/g, '"') : '', total: t != null ? Number(t) : null };
  }

  function parseCandidates(s) {
    try { const a = JSON.parse(s.trim()); if (Array.isArray(a)) return a; } catch (_) { /* fall through to lenient parse */ }
    const field = (o, k) => { const m = o.match(new RegExp(`"${k}"\\s*:\\s*(?:"((?:[^"\\\\]|\\\\.)*)"|(null|true|false|-?\\d+))`)); if (!m) return null; if (m[1] !== undefined) return m[1].replace(/\\"/g, '"'); return m[2] === 'null' ? null : m[2] === 'true' ? true : m[2] === 'false' ? false : Number(m[2]); };
    return (s.match(/\{[^{}]*\}/g) || []).map((o) => ({
      id: field(o, 'id'), name: field(o, 'name'), title: field(o, 'title'), city: field(o, 'city'), updated: field(o, 'updated'), why: field(o, 'why'),
      best_fit: field(o, 'best_fit'), fit_reason: field(o, 'fit_reason'),
    })).filter((c) => c.name || c.id);
  }

  function card(c) {
    const el = document.createElement('article'); el.className = 'card';
    const name = String(c.name || 'Unnamed candidate');
    const ini = name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';
    const meta = [c.title, c.city, c.updated ? `updated ${fmtDate(c.updated)}` : null].filter(Boolean).join(' · ');
    const stale = isStale(c.updated);
    el.innerHTML = `<div class="ini" aria-hidden="true"></div><div class="info"><span class="name"></span><span class="meta"></span><div class="facts"></div><span class="why"></span></div>`;
    if (c.id) el.dataset.id = String(c.id);
    el.querySelector('.ini').textContent = ini;
    el.querySelector('.name').textContent = name;
    const metaEl = el.querySelector('.meta'); metaEl.textContent = meta || 'Profile details not on file';
    if (stale) { const b = document.createElement('span'); b.className = 'stale'; b.textContent = 'over 2 years old'; metaEl.appendChild(b); }
    if (c.why) el.querySelector('.why').textContent = c.why; else el.querySelector('.why').remove();
    if (c.id && /^\d+$/.test(String(c.id))) {
      const actions = document.createElement('div'); actions.className = 'actions';
      const a = document.createElement('a'); a.className = 'open'; a.textContent = 'View resume';
      a.href = `/api/resume/${c.id}`; a.target = '_blank'; a.rel = 'noopener';
      a.setAttribute('aria-label', `View resume for ${name}`);
      actions.appendChild(a);
      if (c.best_fit === true) actions.appendChild(bestFitTag(c.fit_reason || c.why || ''));
      el.appendChild(actions);
    }
    const known = profiles.get(String(c.id));
    if (known) fillFacts(el, known); else if (c.id) loadingFacts(el);
    return el;
  }

  // ---------- quick facts: CATS fields first, then facts read from the resume ----------
  const profiles = new Map();      // id -> CATS profile fields
  const resumeFacts = new Map();   // id -> facts object, or 'loading'
  const AUTO_RESUMES = 5;          // resumes read automatically per result list (CATS allows 500 calls/hour)

  async function enrichCards(root) {
    const cards = [...root.querySelectorAll('.card[data-id]')];
    const ids = [...new Set(cards.map((c) => c.dataset.id).filter((id) => /^\d+$/.test(id)))];
    const need = ids.filter((id) => !profiles.has(id));
    if (need.length) {
      try {
        const r = await fetch(`/api/profiles?ids=${need.join(',')}`);
        if (r.status === 401) { location.href = '/login'; return; }
        const data = await r.json();
        for (const p of data.profiles || []) profiles.set(String(p.id), p);
      } catch (_) { /* facts are optional; cards still work */ }
    }
    ids.forEach(refill);
    const gaps = ids.filter((id) => { const p = profiles.get(id) || {}; return !resumeFacts.has(id) && (!p.desired_pay || !p.experience); });
    if (gaps.length) loadResumeFacts(gaps.slice(0, AUTO_RESUMES));
  }

  async function loadResumeFacts(ids) {
    ids.forEach((id) => { resumeFacts.set(id, 'loading'); refill(id); });
    try {
      const r = await fetch(`/api/resume-facts?ids=${ids.join(',')}`);
      if (r.status === 401) { location.href = '/login'; return; }
      const data = await r.json();
      for (const f of data.facts || []) {
        const id = String(f.id);
        if (f.status === 'error' || f.status === 'limited') resumeFacts.set(id, { ...f, retry: true });
        else resumeFacts.set(id, f);
      }
    } catch (_) {
      ids.forEach((id) => resumeFacts.set(id, { status: 'error', retry: true }));
    }
    ids.forEach(refill);
  }

  function refill(id) {
    document.querySelectorAll(`.card[data-id="${id}"]`).forEach((c) => fillFacts(c, profiles.get(id) || {}));
  }

  function loadingFacts(el) {
    el.querySelector('.facts').replaceChildren(...[1, 2, 3].map(() => { const s = document.createElement('span'); s.className = 'fact loading'; s.setAttribute('aria-hidden', 'true'); return s; }));
  }

  function fillFacts(el, p) {
    const box = el.querySelector('.facts'); box.replaceChildren();
    if (!p || p.missing) return;
    const id = el.dataset.id;
    aiBadge(el, p.ai_read_at);
    const rfRaw = resumeFacts.get(id);
    const loading = rfRaw === 'loading';
    const rf = rfRaw && rfRaw !== 'loading' && rfRaw.status === 'ok' ? rfRaw : null;
    let usedResume = false;

    const add = (label, value, opts = {}) => {
      const s = document.createElement('span'); s.className = 'fact' + (opts.muted ? ' muted' : '');
      if (opts.title) s.title = opts.title;
      if (label) { const b = document.createElement('b'); b.textContent = label + ' '; s.appendChild(b); }
      s.appendChild(document.createTextNode(value)); box.appendChild(s);
    };
    const pick = (catsVal, resumeKey) => {
      if (catsVal) return { value: catsVal };
      if (rf && rf[resumeKey]) { usedResume = true; return { value: rf[resumeKey], resume: true }; }
      return null;
    };
    const missingText = rf ? 'not in resume' : 'not on file';
    const keyFact = (label, v, title) => {
      if (v) add(label, v.value, { title: v.resume ? title : undefined });
      else if (loading) { const s = document.createElement('span'); s.className = 'fact loading'; s.setAttribute('aria-label', `Reading resume for ${label.toLowerCase()}`); box.appendChild(s); }
      else add(label, missingText, { muted: true });
    };

    const expected = pick(p.desired_pay, 'expected_ctc');
    const exp = pick(p.experience, 'experience');
    if (expected) add('Expected', expected.value, { title: expected.resume ? 'Read from the resume' : undefined });
    keyFact('Experience', exp, rf && rf.experience_estimated ? 'Estimated from the job dates in the resume' : 'Read from the resume');
    const cur = pick(p.current_pay, 'current_ctc'); if (cur) add('Current', cur.value);
    const notice = pick(p.notice_period, 'notice'); if (notice) add('Notice', notice.value);
    if (p.date_available) add('Available', /^\d{4}-\d{2}/.test(p.date_available) ? fmtDate(p.date_available) : p.date_available);
    if (p.willing_to_relocate === true) add('', 'Open to relocate');
    if (p.willing_to_relocate === false) add('', 'Not relocating');
    const meta = el.querySelector('.meta').textContent;
    if (p.current_employer && !meta.includes(p.current_employer)) add('At', p.current_employer);

    // Resume status / actions
    if (loading) {
      const n = document.createElement('span'); n.className = 'fact-note'; n.textContent = 'Reading resume…'; box.appendChild(n);
    } else if (!rfRaw && (!expected || !exp)) {
      box.appendChild(factButton('Check resume', () => loadResumeFacts([id])));
    } else if (rfRaw && rfRaw !== 'loading') {
      const notes = { no_resume: 'No resume on file', unreadable: 'Resume could not be read (scanned image?)', too_large: 'Resume file too large to read',
        limited: 'CATS hourly limit nearly used, try later', error: 'Could not read the resume' };
      if (notes[rfRaw.status]) { const n = document.createElement('span'); n.className = 'fact-note'; n.textContent = notes[rfRaw.status]; box.appendChild(n); }
      if (rfRaw.retry) box.appendChild(factButton('Try again', () => loadResumeFacts([id])));
      if (usedResume) {
        const n = document.createElement('span'); n.className = 'fact-note';
        n.textContent = rf && rf.experience_estimated && exp && exp.resume ? 'From resume (~ = estimated from job dates)' : 'From resume';
        box.appendChild(n);
      }
    }
    if (p.key_skills) {
      const k = document.createElement('span'); k.className = 'skills';
      k.textContent = 'Skills: ' + (p.key_skills.length > 110 ? p.key_skills.slice(0, 110) + '…' : p.key_skills);
      box.appendChild(k);
    }
  }
  // "Read by Copilot" badge: shown when the agent itself opened and read this resume.
  function aiBadge(el, readAt) {
    const actions = el.querySelector('.actions'); if (!actions) return;
    actions.querySelector('.ai-read')?.remove();
    if (!readAt) return;
    const b = document.createElement('span'); b.className = 'ai-read';
    b.title = 'HR Copilot opened and read this resume while answering, so its summary is based on the resume itself.';
    b.innerHTML = '<img src="/assets/tangentia-mark.png" alt="" aria-hidden="true"><span>Read by Copilot</span>';
    const fit = actions.querySelector('.fit-wrap');
    if (fit) actions.insertBefore(b, fit); else actions.appendChild(b);
  }
  // "Best fit" tag: the copilot's judgement after reading the resume. Reason shows on hover, focus or tap.
  let tipSeq = 0;
  function bestFitTag(reason) {
    const wrap = document.createElement('div'); wrap.className = 'fit-wrap';
    const id = `fit-tip-${++tipSeq}`;
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fit';
    btn.setAttribute('aria-describedby', id);
    btn.innerHTML = '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span>Best fit</span>';
    const tip = document.createElement('span'); tip.className = 'fit-tip'; tip.id = id; tip.setAttribute('role', 'tooltip');
    tip.textContent = reason || 'The copilot rated this candidate a strong match.';
    btn.addEventListener('click', () => wrap.classList.toggle('open'));
    btn.addEventListener('blur', () => wrap.classList.remove('open'));
    const hint = document.createElement('span'); hint.className = 'fit-hint'; hint.textContent = window.matchMedia('(hover: none)').matches ? 'tap for why' : 'hover for why';
    wrap.append(btn, tip, hint);
    return wrap;
  }
  function factButton(text, onClick) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'fact-btn'; b.textContent = text;
    b.addEventListener('click', onClick); return b;
  }

  // ---------- pagination ----------
  function moreButton(shown, total) {
    const wrap = document.createElement('div'); wrap.className = 'more-row';
    const info = document.createElement('span'); info.className = 'more-info';
    info.textContent = `${total.toLocaleString()} matches in total`;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'more';
    b.textContent = 'Show 10 more';
    b.addEventListener('click', () => send('Show me the next 10 candidates for this same search (next page).'));
    wrap.append(info, b);
    return wrap;
  }

  function fmtDate(d) {
    const dt = new Date(d); if (isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function isStale(d) { const dt = new Date(d); return !isNaN(dt) && (Date.now() - dt) / 864e5 > 730; }

  function statusLine(text, query) {
    const el = document.createElement('div'); el.className = 'status';
    const t = document.createElement('span'); t.textContent = text; el.appendChild(t);
    if (query) { const c = document.createElement('code'); c.textContent = query; c.title = 'Query sent to CATS'; el.appendChild(c); }
    return el;
  }
  function skeleton() { const el = document.createElement('div'); el.className = 'skel'; el.setAttribute('aria-hidden', 'true'); return el; }
  function typing() { const el = document.createElement('div'); el.className = 'typing'; el.setAttribute('aria-label', 'Thinking'); el.innerHTML = '<span></span><span></span><span></span>'; return el; }

  // Plain text with **bold** and line breaks; everything else escaped.
  function paragraphs(text) {
    return text.trim().split(/\n{2,}/).map((block) => {
      const p = document.createElement('p');
      block.split(/(\*\*[^*]+\*\*)/g).forEach((seg) => {
        if (/^\*\*[^*]+\*\*$/.test(seg)) { const b = document.createElement('strong'); b.textContent = seg.slice(2, -2); p.appendChild(b); }
        else seg.split('\n').forEach((line, i) => { if (i) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(line)); });
      });
      return p;
    });
  }
})();
</script>
